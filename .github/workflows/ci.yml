name: ci
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mcp } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: mcp }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: mcp/Cargo.toml
          command: check advisories
      - run: cargo test --lib
      - run: cargo run --bin tool-catalog > /tmp/tools.md && diff -u ../docs/tools.md /tmp/tools.md
  fixture-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: mcp }
      - uses: actions/cache@v4
        id: fixture-cache
        with:
          path: fixture/data
          key: fixture-${{ hashFiles('fixture/ids.txt', 'fixture/export.sh') }}
      - name: Select PostgreSQL 16 client tools
        run: |
          pg_bin=/usr/lib/postgresql/16/bin
          if [[ ! -x "$pg_bin/pg_dump" || ! -x "$pg_bin/psql" ]]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client-16
          fi
          echo "$pg_bin" >> "$GITHUB_PATH"
      - if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: fixture/export.sh
      - run: fixture/load.sh
      - name: Verify the loaded Chado fixture
        shell: bash
        run: |
          psql postgres://flybase_mcp:flybase_mcp@127.0.0.1:5499/flybase -XAt -v ON_ERROR_STOP=1 -f fixture/smoke.sql |
            awk -F '|' '{ print } $2 != "t" { failed = 1 } END { exit (!NR || failed) }'
      - run: cd mcp && cargo test --tests
        env:
          CHADO_URL: postgres://flybase_mcp:flybase_mcp@127.0.0.1:5499/flybase
  blast-jobs-unit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: blast-jobs } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: blast-jobs }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: blast-jobs/Cargo.toml
          command: check advisories licenses
      - run: cargo test
