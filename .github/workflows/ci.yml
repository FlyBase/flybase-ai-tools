name: ci
on: [push, pull_request]
jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mcp } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: mcp }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: mcp/Cargo.toml
          command: check advisories
      - run: cargo test --lib
      - run: cargo run --bin tool-catalog > /tmp/tools.md && diff -u ../docs/tools.md /tmp/tools.md
  fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: mcp }
      - uses: actions/cache@v4
        id: fixture-cache
        with:
          path: fixture/data
          key: fixture-${{ hashFiles('fixture/ids.txt', 'fixture/export.sh') }}
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: fixture/export.sh
      - run: fixture/load.sh
      - run: cd mcp && cargo test --tests
        env:
          CHADO_URL: postgres://flybase_mcp:flybase_mcp@127.0.0.1:5499/flybase
  blast-jobs-unit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: blast-jobs } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: blast-jobs }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: blast-jobs/Cargo.toml
          command: check advisories licenses
      - run: cargo test
  blast-jobs-changes:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    outputs:
      blast_jobs: ${{ steps.filter.outputs.blast_jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            blast_jobs:
              - 'blast-jobs/**'
              - '.github/workflows/ci.yml'
  # The two jobs below download BLAST+ from NCBI, so they run on master pushes and on changes to blast-jobs/
  # only; a slow NCBI must not redden unrelated PRs (design 3.12).
  blast-jobs-integration:
    needs: blast-jobs-changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || needs.blast-jobs-changes.outputs.blast_jobs == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: blast-jobs } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: blast-jobs }
      # The tarball URL and SHA-256 are pinned once, in the Dockerfile.
      - id: pin
        run: |
          echo "url=$(sed -n 's/^ARG BLAST_URL=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "sha=$(sed -n 's/^ARG BLAST_SHA256=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: blast-cache
        with:
          path: ~/ncbi-blast.tar.gz
          key: ncbi-blast-${{ steps.pin.outputs.sha }}
      - if: steps.blast-cache.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 3 -o ~/ncbi-blast.tar.gz "${{ steps.pin.outputs.url }}"
      - run: |
          echo "${{ steps.pin.outputs.sha }}  $HOME/ncbi-blast.tar.gz" | sha256sum -c -
          mkdir -p ~/ncbi-blast && tar -xzf ~/ncbi-blast.tar.gz -C ~/ncbi-blast --strip-components 1
          ~/ncbi-blast/bin/blastn -version
      - run: BLAST_JOBS_REAL_BLAST="$HOME/ncbi-blast/bin" cargo test --test real_blast
  blast-jobs-image:
    needs: blast-jobs-changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || needs.blast-jobs-changes.outputs.blast_jobs == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: blast-jobs } }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t blast-jobs:ci .
      - run: docker image ls blast-jobs:ci
      - run: tests/image-smoke.sh blast-jobs:ci
